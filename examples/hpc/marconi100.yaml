# REDI RAPS Job Extraction — Marconi100 (CINECA, Italy)
#
# Data: SLURM job accounting with per-node power consumption (Parquet + CSV)
# Source: /opt/data/hpc/marconi100/p_m_100.parquet (287 MB, primary)
#         /opt/data/hpc/marconi100/output.csv (326 MB, CSV equivalent)
# Records: ~231,238 jobs
# Columns: 35 (SLURM fields + node/mem/cpu power consumption)
#
# Marconi100 uses the same SLURM schema as Adastra MI250 (both from the
# same RAPS dataloader family). IBM POWER9 CPUs + NVIDIA V100 GPUs.
#
# Power config is loaded automatically from the RAPS system config
# (raps/config/marconi100.yaml) — no need to duplicate it here.

domain: hpc
input_path: /opt/data/hpc/marconi100/p_m_100.parquet
output_dir: ./output/marconi100_raps

raps_jobs:
  enabled: true
  system_name: marconi100
  trace_quanta: 20

  column_scalars:
    time_limit: 60          # SLURM stores time_limit in minutes; convert to seconds
                             # (same convention as mit_supercloud.yaml's timelimit;
                             # confirmed via raw value distribution -- 1440/720/240/60/30
                             # etc. are only sensible as minutes, e.g. 1440min = 24h, the
                             # standard Slurm walltime cap. Left unconverted, wallt_norm =
                             # time_limit/max_walltime_s collapsed every job into [0, 0.017].)

  column_overrides:
    # SLURM-style columns
    job_id: id
    user_id: user
    num_nodes_alloc: nodes_required
    submit_time: submit_time
    start_time: start_time
    end_time: end_time
    time_limit: time_limit
    run_time: expected_run_time
    job_state: end_state
    partition: partition
    priority: priority
    qos: partition              # QOS can map to partition
    num_cores_alloc: cpu_cores_required
    num_gpus_alloc: gpu_units_required
    nodes: scheduled_nodes

  # This source has no dedicated per-GPU power column (the auto-mapper's
  # best fuzzy match, node_power_consumption, is node-total power, not GPU
  # power). Derive gpu_trace as a residual instead, the same way RAPS's own
  # marconi100 dataloader does: node - cpu - mem - nic_term - nvme_term.
  gpu_power_residual:
    node_power_col: node_power_consumption
    cpu_power_col: cpu_power_consumption
    mem_power_col: mem_power_consumption
