# REDI RAPS Job Extraction — Fugaku (RIKEN, Japan)
#
# Data: Job accounting with abbreviated field names (Parquet)
# Source: /opt/data/fugaku/21_04.parquet
# Records: ~116,977 jobs (April 2021)
# Columns: 45 (abbreviated Japanese-style field names + power/performance metrics)
#
# Fugaku uses cryptic abbreviated column names that require explicit mapping.
#
# Power config is loaded automatically from the RAPS system config
# (raps/config/fugaku.yaml) — no need to duplicate it here.

domain: hpc
input_path: /opt/data/fugaku/21_04.parquet
output_dir: ./output/fugaku_raps

raps_jobs:
  enabled: true
  system_name: fugaku
  trace_quanta: 10

  column_overrides:
    # Fugaku's abbreviated field names → RAPS canonical fields
    jid: id
    jnam: name
    usr: account
    nnumr: nodes_required         # Number of nodes requested
    adt: submit_time              # Arrival date/time
    sdt: start_time               # Start date/time
    edt: end_time                 # End date/time
    elpl: time_limit              # Elapsed limit
    duration: expected_run_time
    "exit state": end_state
    pri: priority
    cnumr: cpu_cores_required     # Core number requested
    avgpcon: cpu_trace            # Average power consumption
    pclass: perf_class            # Compute-bound/memory-bound Roofline label (was
                                   # miswired to `partition`, an unrelated scheduler
                                   # queue/partition field expecting int values
                                   # downstream — see JobDictBuilder's "Ensure
                                   # partition is int" coercion, which silently
                                   # zeroed out the pclass string on every job)
    embedding: job_embedding       # Pre-anonymization Sentence-BERT identity
                                   # embedding (usr+jnam+jobenv_req), shipped by
                                   # F-Data itself; usable as a static per-job
                                   # fingerprint feature for historical jobs
    minpcon: cpu_power_min         # Raw per-job min power (Watts), NOT run
    maxpcon: cpu_power_max         # through TraceNormalizer -- distinct from
                                   # avgpcon's cpu_trace (already-normalized
                                   # utilization channel used as model input)
