# REDI RAPS Job Extraction — Google Cluster Traces v2 (2011)
#
# Data: Google cluster trace dataset v2 (gzipped CSV, no headers)
# Source: /opt/data/gcloud/v2/google_cluster_data_2011_sample/
# Format: Multiple sub-tables (job_events, task_events, task_usage, machine_events)
#         each containing part-NNNNN-of-00500.csv.gz files
#
# REDI auto-detects this directory layout and performs the multi-table join:
#   machine_events  → CPU/memory capacity (modal node size)
#   task_events     → sum resource requests per job → nodes_required
#   job_events      → submit times (event_type=0), timestamps μs→s
#   task_usage      → per-job start/end times and CPU traces
#
# Column names (job_ID, user_name, scheduling_class, nodes_required, cpu_trace)
# are auto-mapped to RAPS canonical fields by AutoMapColumns — no overrides needed.

domain: hpc
input_path: /opt/data/gcloud/v2/google_cluster_data_2011_sample
output_dir: ./output/gcloud_v2_raps

raps_jobs:
  enabled: true
  system_name: gcloudv2
