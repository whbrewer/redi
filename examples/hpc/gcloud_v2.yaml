# REDI RAPS Job Extraction — Google Cluster Traces v2 (2011)
#
# Data: Google cluster trace dataset v2 (gzipped CSV, no headers)
# Source: /opt/data/gcloud/v2/google_cluster_data_2011_sample/
# Format: Multiple sub-tables (job_events, task_events, task_usage, machine_events)
#
# NOTE: Google cluster traces v2 are headerless CSVs with hashed identifiers.
# The column names are defined by the schema documentation. The job_events table
# has these positional columns:
#   0: timestamp, 1: missing_info, 2: job_id, 3: event_type,
#   4: user, 5: scheduling_class, 6: job_name, 7: logical_job_name
#
# Pre-processing is recommended to add headers and join job_events with
# task_events for resource requirements. Example:
#
#   zcat job_events/part-00000-of-00500.csv.gz | \
#     awk -F, '{print NR","$0}' > gcloud_jobs.csv
#
# This config assumes a pre-processed CSV with headers added.

domain: hpc
input_path: ./gcloud_v2_jobs.csv  # Pre-processed with headers
output_dir: ./output/gcloud_v2_raps

raps_jobs:
  enabled: true
  system_name: gcloudv2

  column_overrides:
    # Google cluster trace v2 field names → RAPS canonical
    job_id: id
    job_name: name
    user: account
    scheduling_class: priority
    timestamp: submit_time
    # Note: Google traces lack explicit node counts and time limits.
    # Resource requests are in task_events, not job_events.
    # Joining task_events would provide cpu_request, memory_request, etc.
