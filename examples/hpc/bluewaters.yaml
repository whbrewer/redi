# REDI RAPS Job Extraction — Blue Waters (NCSA, Illinois)
#
# Data: Torque/PBS job accounting logs (semi-colon delimited key=value records)
# Source: /opt/data/bluewaters/torque_logs/
# Records: ~365 daily log files (2017), millions of job records total
# Format: Raw PBS Torque directory layout (native ingest supported)
#
# This config follows the RAPS Blue Waters convention and points at the root
# dataset directory (same style as: `raps run -f /opt/data/bluewaters ...`).

domain: hpc
input_path: /opt/data/hpc/bluewaters
output_dir: ./output/bluewaters_raps
# RAPS's ground truth for this system buckets jobs by which single day-file
# (torque_logs/20170328) their completion ("E") record lands in -- i.e. by
# end_time on Blue Waters' local clock (America/Chicago, CDT = UTC-5 on this
# date), not by submit_time. Match that population here: filter on end_time,
# with the window shifted to compensate for REDI's naive-local (host is EDT,
# UTC-4) date parsing, so the effective boundary is 2017-03-28T00:00 CDT to
# 2017-03-29T00:00 CDT (2017-03-28T05:00Z to 2017-03-29T05:00Z).
start: "2017-03-28T01:00:00"
end: "2017-03-29T01:00:00"
date_filter_field: end_time

raps_jobs:
  enabled: true
  system_name: bluewaters
  trace_quanta: 60          # BlueWaters Cray system sampler trace resolution

  column_overrides:
    # PBS/Torque field names → RAPS canonical fields
    # Note: LoadTorqueData lowercases all keys, so overrides must use lowercase too.
    jobid: id
    user: account
    "resource_list.nodect": nodes_required      # was Resource_List.nodect (wrong case)
    qtime: submit_time
    start: start_time
    end: end_time
    "resource_list.walltime": time_limit        # requested walltime (HH:MM:SS)
    exit_status: end_state
    queue: partition
    exec_host: scheduled_nodes
    # expected_run_time is auto-derived from end_time - start_time by DeriveJobFields
