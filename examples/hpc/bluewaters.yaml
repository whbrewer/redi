# REDI RAPS Job Extraction — Blue Waters (NCSA, Illinois)
#
# Data: Torque/PBS job accounting logs (semi-colon delimited key=value records)
# Source: /opt/data/bluewaters/torque_logs/
# Records: ~365 daily log files (2017), millions of job records total
# Format: Raw PBS Torque directory layout (native ingest supported)
#
# This config follows the RAPS Blue Waters convention and points at the root
# dataset directory (same style as: `raps run -f /opt/data/bluewaters ...`).

domain: hpc
input_path: /opt/data/bluewaters
output_dir: ./output/bluewaters_raps

raps_jobs:
  enabled: true
  system_name: bluewaters

  column_overrides:
    # PBS/Torque field names → RAPS canonical fields
    jobid: id
    user: account
    "Resource_List.nodect": nodes_required
    qtime: submit_time
    start: start_time
    end: end_time
    "Resource_List.walltime": time_limit
    exit_status: end_state
    queue: partition
    exec_host: scheduled_nodes
