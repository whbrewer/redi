# REDI RAPS Job Extraction — Philly (Microsoft Research)
#
# Data: GPU cluster job trace log (single-line JSON array)
# Source: /opt/data/philly/trace-data/cluster_job_log
# Format: JSON array of job objects
# Records: Thousands of deep-learning training jobs (Oct-Dec 2017)
#
# Each job object has:
#   status, vc, jobid, user, submitted_time,
#   attempts: [{start_time, end_time, detail: [{ip, gpus: [...]}]}]
#
# NOTE: Philly's "attempts" field is nested — each job may have multiple
# scheduling attempts with different start/end times and GPU assignments.
# The mapper will use the top-level fields. For multi-attempt jobs, you may
# want to pre-process to flatten the last attempt's times.
#
# Also available:
#   - gpu_by_day/*.csv — per-machine GPU utilization time series
#   - cpu_by_day/*.csv — per-machine CPU utilization time series

domain: hpc
input_path: /opt/data/philly/trace-data/cluster_job_log
output_dir: ./output/philly_raps

raps_jobs:
  enabled: true
  system_name: philly

  column_overrides:
    # Philly JSON field names → RAPS canonical
    jobid: id
    user: account
    submitted_time: submit_time
    status: end_state
    vc: partition                  # virtual cluster → partition
    # Note: start_time, end_time, and num_gpus are nested inside
    # attempts[].detail[]. Pre-flatten for best results.
