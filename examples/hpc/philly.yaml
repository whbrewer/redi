# REDI RAPS Job Extraction — Philly (Microsoft Research)
#
# Data: GPU cluster job trace log (single-line JSON array)
# Source: /opt/data/philly/trace-data/
# Format: Directory with cluster_job_log (JSON), cpu_by_day/, gpu_by_day/
# Records: Thousands of deep-learning training jobs (Oct-Dec 2017)
#
# Each job object has:
#   status, vc, jobid, user, submitted_time,
#   attempts: [{start_time, end_time, detail: [{ip, gpus: [...]}]}]
#
# REDI auto-detects the Philly layout and handles the multi-attempt nesting:
# uses first attempt's start_time, last attempt's end_time, and last attempt's
# detail for nodes_required. CPU/GPU traces are joined from cpu_by_day/ and
# gpu_by_day/ if those directories exist (created by parse_philly_traces.py).

domain: hpc
input_path: /opt/data/philly/trace-data
output_dir: ./output/philly_raps
start: "2017-10-03T00:00"
end: "2017-10-04T00:00"

raps_jobs:
  enabled: true
  system_name: philly
  trace_quanta: 60          # Philly CPU/GPU traces are at 60-second intervals

  column_overrides:
    # Philly JSON field names → RAPS canonical
    jobid: id
    user: account
    submitted_time: submit_time
    status: end_state
    vc: partition                  # virtual cluster → partition
    # Note: start_time, end_time, and num_gpus are nested inside
    # attempts[].detail[]. Pre-flatten for best results.
