# REDI RAPS Job Extraction — Frontier (ORNL, Oak Ridge)
#
# Data: SLURM joblive records (Parquet, partitioned by date)
# Source: /opt/data/frontier/slurm/joblive/date=2024-01-18/
# Records: ~152,922 jobs per partition
# Columns: 29 (SLURM accounting + xnames node list)
#
# Frontier also has:
#   - jobprofile/ — per-timestep power telemetry (130+ columns, joined on allocation_id)
#   - cdu/ — cooling distribution unit telemetry (17 columns)
#
# When jobprofile_path is set, REDI joins joblive + jobprofile on allocation_id
# to produce per-timestep cpu_trace/gpu_trace arrays (matching RAPS behavior).
# Jobs without matching jobprofile entries are filtered out.

domain: hpc
input_path: "/opt/data/frontier/slurm/joblive/date=2024-01-18/*.parquet"
output_dir: ./output/frontier_raps

raps_jobs:
  enabled: true
  system_name: frontier
  jobprofile_path: "/opt/data/frontier/jobprofile/date=2024-01-18/*.parquet"

  # Trace time-step from RAPS scheduler config (seconds)
  # From raps/config/frontier.yaml: scheduler.trace_quanta = 15
  trace_quanta: 15

  # Priority policy: applied when source data has no priority column.
  # "frontier" implements the OLCF aging boost by node count:
  # https://docs.olcf.ornl.gov/systems/frontier_user_guide.html#job-priority-by-node-count
  priority_policy: frontier

  # Power config for trace normalization (from RAPS frontier.yaml)
  # Used when RAPS is not installed; overridden by RAPS system config when available
  power_config:
    cpu:
      idle: 90
      max: 280
      per_node: 1    # cpus_per_node
    gpu:
      idle: 44
      max: 238
      per_node: 8    # gpus_per_node

  # System topology for xname → node index conversion
  topology:
    sc_shape: [25, 3, 128]
    blades_per_chassis: 8
    nodes_per_blade: 2

  column_overrides:
    # Frontier SLURM joblive column names → RAPS canonical fields
    job_id: id
    name: name
    account: account
    node_count: nodes_required
    time_submission: submit_time
    time_start: start_time
    time_end: end_time
    time_limit: time_limit
    time_elapsed: expected_run_time
    state_current: end_state
    partition: partition
    xnames: scheduled_nodes
