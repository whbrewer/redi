# REDI Sidecar Configuration - ClimaX TaiESM1 Example
#
# Example configuration for observing the ClimaX data preprocessing pipeline.
# This Snakemake workflow downloads CMIP6 data and regrids it for ClimaX training.
#
# Use with: redi sidecar -c sidecar_climax_example.yaml
#
# The workflow is at: climate/ClimaX/snakemake_configs/TaiESM1/Snakefile

workflow: /home/w1b/drai/domains/climate/ClimaX/snakemake_configs/TaiESM1/Snakefile

workflow_type: snakemake

output_dir: ./climax_redi_output

style: rich

# Explicit stage mapping for this workflow
stage_mapping:
  ingest:
    - download       # Downloads from ESGF servers
  preprocess:
    - regrid         # Regrids to target resolution (e.g., 5.625deg)
  output:
    - delete         # Cleanup step (rename .tmp to final)
    - all            # Final target

# Data Card generation
data_card:
  enabled: true
  output_patterns:
    - "TaiESM1/**/*.nc"

  metadata:
    project: "ClimaX - Foundation Model for Weather and Climate"
    source: "CMIP6 TaiESM1 Historical Run"
    variables:
      - ta (Air Temperature)
      - z (Geopotential)
      - u (Eastward Wind)
      - v (Northward Wind)
    temporal_coverage: "1850-2015"
    spatial_resolution: "5.625 degrees"
    institution: "AS-RCEC (TaiESM1 model)"

# Provenance tracking
provenance:
  enabled: true
  output_file: ./climax_redi_output/provenance.json
  include_hashes: true

# Snakemake integration
integration:
  snakemake:
    parse_config: true
    # Expected config keys from Snakemake
    config_keys:
      - server_prefix
      - run
      - cmip_name
      - era_name
      - name
      - datadir
      - res
