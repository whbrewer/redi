# REDI Analyze Configuration
#
# Use with: redi analyze -c analyze_config.yaml
#
# Analyze mode observes existing workflows (Snakemake, Nextflow, etc.)
# and provides consistent data readiness tracking without replacing the workflow.

# Workflow file to observe
workflow: ./Snakefile

# Workflow type (auto-detected if not specified)
# Options: auto, snakemake, nextflow, bash
workflow_type: auto

# Output directory for reports
output_dir: ./redi_output

# Watch mode - continuously monitor workflow changes
watch: false

# Output style: rich, simple, json
style: rich

# Stage mapping overrides (optional)
# By default, REDI infers stage mappings from rule names.
# Use this to explicitly map rules to REDI stages.
stage_mapping:
  ingest:
    - download
    - fetch_data
  preprocess:
    - regrid
    - clean
    - qc_check
  transform:
    - normalize
    - compute_anomalies
  structure:
    - merge_files
    - concat_time
  output:
    - save_zarr
    - create_splits
    - all

# Hooks - commands to run at various points (optional)
hooks:
  # Run before workflow starts
  pre_workflow: |
    echo "Starting workflow observation"

  # Run after each rule completes
  post_rule: |
    echo "Rule completed: ${RULE_NAME}"

  # Run after workflow completes
  post_workflow: |
    echo "Workflow complete, generating Data Card"

# Data Card generation settings
data_card:
  # Generate Data Card after workflow completes
  enabled: true

  # Path to output files (for analysis)
  output_patterns:
    - "output/**/*.nc"
    - "output/**/*.zarr"

  # Additional metadata to include
  metadata:
    project: "Climate Data Processing"
    version: "1.0.0"
    contact: "team@example.org"

# Provenance tracking
provenance:
  # Track input/output lineage
  enabled: true

  # Store provenance records
  output_file: ./redi_output/provenance.json

  # Include file hashes for reproducibility
  include_hashes: true

# Integration with existing workflow
integration:
  # Snakemake-specific options
  snakemake:
    # Parse config from Snakemake configfile
    parse_config: true

    # Include Snakemake's DAG in analysis
    include_dag: true

  # Nextflow-specific options
  nextflow:
    # Parse nextflow.config
    parse_config: true
