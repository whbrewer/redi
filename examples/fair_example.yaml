# REDI FAIR Example Configuration
#
# This example demonstrates FAIR principles assessment alongside data processing.
# Run with: redi examples/fair_example.yaml
#
# Files in this example:
#   - fair_sample_data.csv      : Sample weather observation data
#   - fair_sample_data.fair.yaml: FAIR metadata sidecar file
#   - fair_example.yaml         : This configuration file

# Input data
input_path: examples/fair_sample_data.csv

# Domain (auto-detected as 'climate' from column names)
domain: climate

# Output settings
output_dir: ./output/fair_example
output_format: npz

# Pipeline stages to run
# stages: [ingest, preprocess, transform, structure, output]  # all stages

# Normalization
normalize:
  enabled: true
  method: zscore

# Train/val/test split
split:
  method: random
  ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  shuffle: true
  random_seed: 42

# =============================================================================
# FAIR Assessment Configuration
# =============================================================================

fair:
  enabled: true
  # Path to FAIR metadata sidecar file
  # Supports: absolute path, relative path, or 'auto' to find <input>.fair.yaml
  metadata_file: examples/fair_sample_data.fair.yaml

  # Which domain standards to check (auto = based on detected domain)
  standards: auto

  # Strict mode requires all principles to be assessable
  strict_mode: false
