# REDI Catalog Export Example Configuration
#
# This example demonstrates exporting REDI-processed datasets to a data catalog.
# Supports: OpenMetadata, MLflow (planned), Intake (planned)
#
# Run with: redi examples/catalog_example.yaml
#
# Prerequisites for OpenMetadata:
#   1. Install SDK: pip install openmetadata-ingestion
#   2. Run OpenMetadata server (see below for Docker quick start)
#   3. Set token: export OPENMETADATA_TOKEN="your-jwt-token"
#
# Quick Start - OpenMetadata with Docker:
#   git clone https://github.com/open-metadata/OpenMetadata
#   cd OpenMetadata/docker/development
#   docker compose up -d
#   # Access UI at http://localhost:8585 (admin/admin)
#   # Get JWT token from Settings > Bots > ingestion-bot

# =============================================================================
# Input Configuration
# =============================================================================

# Input data file (replace with your data)
input_path: examples/fair_sample_data.csv

# Scientific domain (auto-detected if omitted)
domain: climate

# Output settings
output_dir: ./output/catalog_example
output_format: parquet  # parquet works well for catalog discovery

# =============================================================================
# Pipeline Configuration
# =============================================================================

# Normalization
normalize:
  enabled: true
  method: zscore

# Train/val/test split
split:
  method: random
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  shuffle: true
  random_seed: 42

# =============================================================================
# FAIR Assessment (recommended for catalog metadata)
# =============================================================================

fair:
  enabled: true
  metadata_file: examples/fair_sample_data.fair.yaml
  standards: auto

# =============================================================================
# Catalog Export Configuration
# =============================================================================

catalog:
  # Enable catalog export after pipeline completes
  enabled: true

  # Catalog backend type
  # Options: openmetadata, mlflow (planned), intake (planned)
  type: openmetadata

  # OpenMetadata server URL
  # For local Docker: http://localhost:8585/api
  # For cloud: https://your-instance.openmetadata.cloud/api
  host: http://localhost:8585/api

  # Authentication token
  # Option 1: Set directly (not recommended for shared configs)
  # token: "eyJ..."
  #
  # Option 2: Use environment variable (recommended)
  # The token will be read from this env var if 'token' is not set
  token_env: OPENMETADATA_TOKEN

  # Service name in OpenMetadata
  # This creates/uses an ML Model Service with this name
  service_name: redi

  # SSL verification (set to false for self-signed certs)
  verify_ssl: true

# =============================================================================
# Alternative: CLI Usage
# =============================================================================
#
# Instead of YAML config, you can use CLI flags:
#
#   # Basic usage with env var for token
#   export OPENMETADATA_TOKEN="your-jwt-token"
#   redi data.csv --catalog --catalog-host http://localhost:8585/api
#
#   # With explicit token (less secure)
#   redi data.csv --catalog \
#     --catalog-host http://localhost:8585/api \
#     --catalog-token "your-jwt-token" \
#     --catalog-service my-datasets
#
#   # Different catalog types (when implemented)
#   redi data.csv --catalog --catalog-type mlflow
#   redi data.csv --catalog --catalog-type intake

