# REDI Catalog Export Example Configuration
#
# This example demonstrates exporting REDI-processed datasets to a data catalog.
# Default: HuggingFace Hub (simplest, no server required)
# Also supports: OpenMetadata, MLflow (planned), Intake (planned)
#
# Run with: redi examples/catalog_example.yaml
#
# Prerequisites for HuggingFace:
#   1. Install: pip install datasets huggingface_hub
#   2. Get token: https://huggingface.co/settings/tokens
#   3. Set token: export HF_TOKEN="hf_..."

# =============================================================================
# Input Configuration
# =============================================================================

input_path: examples/fair_sample_data.csv
domain: climate
output_dir: ./output/catalog_example
output_format: parquet  # parquet works well for HuggingFace

# =============================================================================
# Pipeline Configuration
# =============================================================================

normalize:
  enabled: true
  method: zscore

split:
  method: random
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  shuffle: true
  random_seed: 42

# =============================================================================
# FAIR Assessment (recommended - adds metadata to catalog)
# =============================================================================

fair:
  enabled: true
  metadata_file: examples/fair_sample_data.fair.yaml

# =============================================================================
# Catalog Export Configuration
# =============================================================================

catalog:
  enabled: true

  # --- HuggingFace Hub (Default - Simplest Option) ---
  type: huggingface

  # Repository name on HuggingFace Hub
  # Format: "username/dataset-name" or "organization/dataset-name"
  # If not set, auto-generated from input filename
  repo_id: null  # e.g., "your-username/climate-sample"

  # Make dataset private (recommended for testing)
  private: true

  # Token can be set here or via HF_TOKEN env var (recommended)
  # token: "hf_..."

# =============================================================================
# CLI Usage Examples
# =============================================================================
#
# HuggingFace (default):
#   export HF_TOKEN="hf_..."
#   redi data.csv --catalog
#   redi data.csv --catalog --catalog-repo my-org/my-dataset
#   redi data.csv --catalog --catalog-private  # private dataset
#
# OpenMetadata:
#   export OPENMETADATA_TOKEN="eyJ..."
#   redi data.csv --catalog --catalog-type openmetadata \
#       --catalog-host http://localhost:8585/api

