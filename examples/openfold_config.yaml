# REDI Configuration for OpenFold Dataset
#
# Input: OpenFold data directory containing:
#   fasta/        <PDB_ID>.fasta  — amino acid sequences
#   pdb/          <PDB_ID>.cif   — mmCIF structure files
#   alignments/   <PDB_ID>/      — A3M MSA files (optional)
#   protein_list.txt              — ordered list of PDB IDs (optional)
#
# Usage:
#   redi run /opt/drai/openfold_data/ -c examples/openfold_config.yaml
#   redi run /opt/drai/openfold_data/ --domain life_sciences -o ./openfold_ready

domain: life_sciences
output_dir: ./openfold_ready
output_format: npz

# Train/val/test split (applied at the protein level)
split:
  train: 0.8
  val: 0.1
  test: 0.1
  random_seed: 42

# Output
# Each protein is saved as <split>/<PDB_ID>.npz with the following features:
#
#   aatype                  int32  [N_res, 21]       one-hot amino acid identity
#   residue_index           int32  [N_res]            0-based position in chain
#   seq_length              int32  [N_res]            residue count (repeated)
#   between_segment_residues int32 [N_res]            zeros for single-chain
#   msa                     int32  [N_seq, N_res]     HHBLITS integer-encoded MSA
#   deletion_matrix_int     int32  [N_seq, N_res]     insertion counts per position
#   num_alignments          int32  [N_res]            MSA depth (repeated)
#   all_atom_positions      float32 [N_res, 37, 3]   ground-truth atom coordinates
#   all_atom_mask           float32 [N_res, 37]       atom presence mask
#   resolution              float32 [1]               crystallographic resolution
#   is_distillation         float32 scalar            0.0 for PDB structures
