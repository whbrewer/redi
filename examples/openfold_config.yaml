# REDI Configuration for OpenFold Dataset
#
# Input: OpenFold data directory containing:
#   fasta/        <PDB_ID>.fasta  — amino acid sequences
#   pdb/          <PDB_ID>.cif   — mmCIF structure files
#   alignments/   <PDB_ID>/      — A3M MSA files (optional)
#   protein_list.txt              — ordered list of PDB IDs (optional)
#
# Usage:
#   redi run /opt/drai/openfold_data/ -c examples/openfold_config.yaml
#   redi run /opt/drai/openfold_data/ --domain life_sciences -o ./openfold_ready

domain: life_sciences
output_dir: ./openfold_ready

# Train/val split (90/10 — matches OpenFold's DataModule convention)
split:
  train: 0.9
  val: 0.1
  random_seed: 42

# Output layout (drop-in compatible with OpenFold's OpenFoldDataModule):
#
#   openfold_ready/
#       train_data/                 .cif files for training proteins
#       val_data/                   .cif files for validation proteins
#       train_alignments/<PDB_ID>/  A3M + pdb70.m8 files for training
#       val_alignments/<PDB_ID>/    A3M + pdb70.m8 files for validation
#       chain_data_cache_train.json per-chain metadata (seq, resolution, release_date)
#       chain_data_cache_val.json
#
# Pass to OpenFoldDataModule:
#   OpenFoldDataModule(
#       train_data_dir        = 'openfold_ready/train_data',
#       train_alignment_dir   = 'openfold_ready/train_alignments',
#       val_data_dir          = 'openfold_ready/val_data',
#       val_alignment_dir     = 'openfold_ready/val_alignments',
#       chain_data_cache_path = 'openfold_ready/chain_data_cache_train.json',
#       ...
#   )
