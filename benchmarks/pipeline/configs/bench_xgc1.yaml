# REDI Benchmark Config — XGC1 ITER fusion simulation (xgc1 plugin)
#
# SC26 paper: pipeline stage timing benchmark
# Input: XGC1 root directory containing case subdirectories
#   /lustre/orion/world-shared/fus184/jyc/fusiond-seed-xgc1-data-samples/
#     n560fr_ITER_PFPO_W_Ne/
#       fort.input.used
#       xgc.mesh.bp
#       xgc.3d.000{02,04,06,08,10}.bp
#
# case_filter and max_timesteps are overridden at runtime by the benchmark runner.

domain: xgc1
output_format: pt
provenance: true

# Limit to one case and N timesteps for the benchmark
case_filter: n560fr_ITER_PFPO_W_Ne
max_timesteps: 5
